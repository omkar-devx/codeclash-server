services:
  redis:
    image: redis:7-alpine
    container_name: codeclash_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    networks:
      - codeclash_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  express-server:
    build:
      context: .
      dockerfile: Dockerfile.node
    container_name: express-server-container
    restart: unless-stopped
    ports:
      - '8000:8000'
    environment:
      - PORT=${PORT:-8000}
      - MONGODB_URI=${MONGODB_URI}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET}
      - ACCESS_TOKEN_EXPIRY=${ACCESS_TOKEN_EXPIRY}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET}
      - REFRESH_TOKEN_EXPIRY=${REFRESH_TOKEN_EXPIRY}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_SECRET_KEY=${CLOUDINARY_SECRET_KEY}
      - RAPID_API_KEY=${RAPID_API_KEY}
      - CODECLASH_CODE_EXECUTION=${CODECLASH_CODE_EXECUTION}
      - SIMULATE_CONTAINER_FAILURE=${SIMULATE_CONTAINER_FAILURE}
    networks:
      - codeclash_net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: nginx
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - express-server
    networks:
      - codeclash_net

volumes:
  redis-data:

networks:
  codeclash_net:
    driver: bridge
