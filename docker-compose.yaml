version: '3.8'
services:
  redis:
    image: redis:7-alpine
    container_name: codeclash_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    networks:
      - codeclash_net

volumes:
  redis-data:

networks:
  codeclash_net:
    driver: bridge
