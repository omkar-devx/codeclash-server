name: CI/CD - Node.js Deployment to Azure VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: azure-vm

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry (ACR)
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build & Push Nginx Image
        uses: docker/build-push-action@v5
        with:
          context: ./nginx
          file: nginx/Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/nginx:latest
            ${{ secrets.ACR_LOGIN_SERVER }}/nginx:${{ github.sha }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.node
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/express-server:latest
            ${{ secrets.ACR_LOGIN_SERVER }}/express-server:${{ github.sha }}

      - name: Deploy to Azure VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}

          script: |
            echo "Deployment sequence started on VM..."
            COMMIT_SHA="${{ github.sha }}"
            NEW_CONTAINER_NAME="express-server-container-new"
            OLD_CONTAINER_NAME="express-server-container"

            # 1. Log in to ACR on the VM to authenticate pull
            sudo docker login ${{ secrets.ACR_LOGIN_SERVER }} -u ${{ secrets.ACR_USERNAME }} -p ${{ secrets.ACR_PASSWORD }}

            # 2. Create Docker network if it doesn't exist
            sudo docker network inspect codeclash_net >/dev/null 2>&1 || sudo docker network create codeclash_net

            # 3. Pull the newly built image (using SHA tag for version tracking)
            echo "Pulling new image with SHA: $COMMIT_SHA"
            sudo docker pull ${{ secrets.ACR_LOGIN_SERVER }}/express-server:$COMMIT_SHA
            sudo docker pull ${{ secrets.ACR_LOGIN_SERVER }}/nginx:$COMMIT_SHA

            # 4. Start new express-server container with temporary name (keep old one running)
            echo "Starting new express-server container..."
            sudo docker run -d \
              --name $NEW_CONTAINER_NAME \
              --network codeclash_net \
              -e PORT="${{ secrets.PORT }}" \
              -e CORS_ORIGINS="${{ secrets.CORS_ORIGINS }}" \
              -e MONGODB_URI="${{ secrets.MONGODB_URI }}" \
              -e ACCESS_TOKEN_SECRET="${{ secrets.ACCESS_TOKEN_SECRET }}" \
              -e ACCESS_TOKEN_EXPIRY="${{ secrets.ACCESS_TOKEN_EXPIRY }}" \
              -e REFRESH_TOKEN_SECRET="${{ secrets.REFRESH_TOKEN_SECRET }}" \
              -e REFRESH_TOKEN_EXPIRY="${{ secrets.REFRESH_TOKEN_EXPIRY }}" \
              -e CLOUDINARY_CLOUD_NAME="${{ secrets.CLOUDINARY_CLOUD_NAME }}" \
              -e CLOUDINARY_API_KEY="${{ secrets.CLOUDINARY_API_KEY }}" \
              -e CLOUDINARY_SECRET_KEY="${{ secrets.CLOUDINARY_SECRET_KEY }}" \
              -e RAPID_API_KEY="${{ secrets.RAPID_API_KEY }}" \
              -e CODECLASH_CODE_EXECUTION="${{ secrets.CODECLASH_CODE_EXECUTION }}" \
              ${{ secrets.ACR_LOGIN_SERVER }}/express-server:$COMMIT_SHA

            # 5. Wait a few seconds and check if new container is running
            echo "Waiting for new container to start..."
            sleep 5

            if sudo docker ps | grep -q $NEW_CONTAINER_NAME; then
              echo "New container started successfully. Checking health..."
              sleep 10
              
              # Check if container is still running (simple health check)
              if sudo docker ps | grep -q $NEW_CONTAINER_NAME; then
                echo "New container is healthy. Switching to new container..."
                
                # Stop and remove old container (if it exists)
                sudo docker rm -f $OLD_CONTAINER_NAME || true
                
                # Rename new container to production name
                sudo docker rename $NEW_CONTAINER_NAME $OLD_CONTAINER_NAME
                
                echo "Express-server deployment successful!"
              else
                echo "ERROR: New container stopped unexpectedly. Keeping old container running."
                sudo docker rm -f $NEW_CONTAINER_NAME || true
                exit 1
              fi
            else
              echo "ERROR: Failed to start new container. Keeping old container running."
              sudo docker rm -f $NEW_CONTAINER_NAME || true
              exit 1
            fi

            # 6. Update nginx (less critical, can be done more safely)
            echo "Updating nginx..."
            sudo docker rm -f nginx || true
            sudo docker run -d \
              --name nginx \
              --network codeclash_net \
              -p 80:80 \
              ${{ secrets.ACR_LOGIN_SERVER }}/nginx:$COMMIT_SHA

            # 7. Clean up old images (keep last 2 versions)
            echo "Cleaning up old images..."
            sudo docker image prune -af --filter "until=24h" || true

            echo "Deployment Complete. Access your app at http://${{ secrets.VM_HOST }}:3000"
            echo "Deployed commit SHA: $COMMIT_SHA"
