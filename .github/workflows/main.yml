name: CI/CD - Node.js Deployment to Azure VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: azure-vm

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry (ACR)
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build & Push Nginx Image
        uses: docker/build-push-action@v5
        with:
          context: ./nginx
          file: nginx/Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/nginx:latest
            ${{ secrets.ACR_LOGIN_SERVER }}/nginx:${{ github.sha }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.node
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/express-server:latest
            ${{ secrets.ACR_LOGIN_SERVER }}/express-server:${{ github.sha }}

      - name: Copy docker-compose files to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: 'docker-compose.yaml,docker-compose.prod.yml'
          target: '/tmp/docker-compose'
          strip_components: 0

      - name: Deploy to Azure VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}

          script: |
            echo "Deployment sequence started on VM..."
            COMMIT_SHA="${{ github.sha }}"
            ACR_SERVER="${{ secrets.ACR_LOGIN_SERVER }}"
            DEPLOY_DIR="/tmp/docker-compose"

            # 1. Log in to ACR on the VM to authenticate pull
            sudo docker login $ACR_SERVER -u ${{ secrets.ACR_USERNAME }} -p ${{ secrets.ACR_PASSWORD }}

            # 2. Pull the newly built images (using SHA tag for version tracking)
            echo "Pulling new images with SHA: $COMMIT_SHA"
            sudo docker pull $ACR_SERVER/express-server:$COMMIT_SHA
            sudo docker pull $ACR_SERVER/nginx:$COMMIT_SHA

            # 3. Tag images as latest for docker-compose
            sudo docker tag $ACR_SERVER/express-server:$COMMIT_SHA $ACR_SERVER/express-server:latest
            sudo docker tag $ACR_SERVER/nginx:$COMMIT_SHA $ACR_SERVER/nginx:latest

            # 4. Navigate to directory with docker-compose files
            cd $DEPLOY_DIR
            echo "Using deployment directory: $DEPLOY_DIR"

            # 5. Export environment variables for docker-compose
            export PORT="${{ secrets.PORT }}"
            export MONGODB_URI="${{ secrets.MONGODB_URI }}"
            export CORS_ORIGINS="${{ secrets.CORS_ORIGINS }}"
            export ACCESS_TOKEN_SECRET="${{ secrets.ACCESS_TOKEN_SECRET }}"
            export ACCESS_TOKEN_EXPIRY="${{ secrets.ACCESS_TOKEN_EXPIRY }}"
            export REFRESH_TOKEN_SECRET="${{ secrets.REFRESH_TOKEN_SECRET }}"
            export REFRESH_TOKEN_EXPIRY="${{ secrets.REFRESH_TOKEN_EXPIRY }}"
            export CLOUDINARY_CLOUD_NAME="${{ secrets.CLOUDINARY_CLOUD_NAME }}"
            export CLOUDINARY_API_KEY="${{ secrets.CLOUDINARY_API_KEY }}"
            export CLOUDINARY_SECRET_KEY="${{ secrets.CLOUDINARY_SECRET_KEY }}"
            export RAPID_API_KEY="${{ secrets.RAPID_API_KEY }}"
            export CODECLASH_CODE_EXECUTION="${{ secrets.CODECLASH_CODE_EXECUTION }}"
            export SIMULATE_CONTAINER_FAILURE="${{ secrets.SIMULATE_CONTAINER_FAILURE }}"
            export ACR_REGISTRY="$ACR_SERVER"

            # 6. Stop existing containers gracefully
            echo "Stopping existing containers..."
            sudo -E docker-compose -f $DEPLOY_DIR/docker-compose.yaml -f $DEPLOY_DIR/docker-compose.prod.yml down || true

            # 7. Start services with docker-compose (merges base + prod override)
            echo "Starting services with docker-compose..."
            sudo -E docker-compose -f $DEPLOY_DIR/docker-compose.yaml -f $DEPLOY_DIR/docker-compose.prod.yml up -d

            # 8. Wait for services to be healthy
            echo "Waiting for services to be healthy..."
            sleep 15

            # 9. Verify containers are running
            if sudo docker ps | grep -q express-server-container && sudo docker ps | grep -q nginx && sudo docker ps | grep -q codeclash_redis; then
              echo "All containers started successfully!"
            else
              echo "ERROR: Some containers failed to start. Checking logs..."
              sudo -E docker-compose -f $DEPLOY_DIR/docker-compose.yaml -f $DEPLOY_DIR/docker-compose.prod.yml logs
              exit 1
            fi

            # 11. Clean up old images (keep last 2 versions)
            echo "Cleaning up old images..."
            sudo docker image prune -af --filter "until=24h" || true

            echo "Deployment Complete. Access your app at http://${{ secrets.VM_HOST }}"
            echo "Deployed commit SHA: $COMMIT_SHA"
